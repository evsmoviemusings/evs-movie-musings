backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "reviews"
    label: "Reviews"
    files:
      - name: "reviews"
        label: "All Reviews"
        file: "data/reviews.json"
        fields:
          - label: "Reviews"
            name: "reviews"
            widget: "list"
            summary: "{{title}} ({{category}})"
            fields:
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Horror", value: "horror" }
                  - { label: "New Release", value: "new-release" }
                  - { label: "Old Release", value: "old-release" }
                  - { label: "Movie List", value: "movie-list" }
              - label: "Kicker (small label above the title)"
                name: "kicker"
                widget: "string"
              - label: "Movie Title"
                name: "title"
                widget: "string"
              - label: "Review Text"
                name: "body"
                widget: "text"
              - label: "Score"
                name: "score"
                widget: "string"
                default: "—"
                hint: "A number like 8, or — if you don't want to rate it yet"
              - label: "Score Unit"
                name: "scoreUnit"
                widget: "string"
                default: "/ 10"
                hint: "e.g. / 10, TBD, or titles"
              - label: "One-line Verdict"
                name: "verdict"
                widget: "string"
              - label: "Date Note"
                name: "date"
                widget: "string"
                hint: "e.g. Watched this week, Draft, Rewatched last month"
